
<x-button [disabled]="loading()" (clicked)="clicked()">Load</x-button>

<div class="grid grid-cols-4">
    <div>Label</div>
    <div>Value</div>
    <div>Question Page</div>
    <div>Question Kind</div>
@for (question of questions(); track $index) {
<div>{{question.label}}</div>
<div>{{question.value}}</div>
<div>{{question.questionPage}}</div>
<div>{{question.questionKind}}</div>
}
</div>
